<!DOCTYPE html>
<html lang="gl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verin Aberto</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="stylesheet" href="./css/dashboard.css">
</head>
<body>
<div class="container">
  <section class="hero">
    <div class="hero-copy">
      <div class="eyebrow" id="hero-eyebrow">Comarca de Verin · Datos abertos</div>
      <h1>Verin Aberto</h1>
      <p id="hero-description">
        Un panel visual para seguir a evolucion territorial da comarca con indicadores varios.
      </p>
      <div id="status" class="status">Cargando configuracion do dashboard...</div>
    </div>
  </section>

  <nav class="scope-nav" aria-label="Ambitos do dashboard">
    <button class="scope-tab active" type="button" data-scope="population">Poboacion</button>
    <button class="scope-tab" type="button" data-scope="economy">Economia</button>
  </nav>

  <section class="dashboard-shell">
    <section class="panel filters">
      <div class="section-heading">
        <div>
          <h2>Filtros</h2>
          <p id="filters-description">Explora cada concello e cambia o ano de detalle.</p>
        </div>
      </div>
      <div class="filter-grid">
        <div class="field">
          <label for="municipio-select">Concello</label>
          <select id="municipio-select" disabled>
            <option value="">Selecciona un concello</option>
          </select>
        </div>
        <div class="field">
          <label for="year-select">Ano de detalle</label>
          <select id="year-select" disabled>
            <option value="">Selecciona un ano</option>
          </select>
        </div>
      </div>
      <div class="footer-note" id="scope-note"></div>
    </section>

    <section class="kpi-grid" id="kpi-grid"></section>
    <section class="charts-grid" id="charts-grid"></section>
  </section>
</div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
